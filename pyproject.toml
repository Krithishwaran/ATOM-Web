[project]
name = "atom-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "websockets>=12.0",
  "numpy>=1.24,<2",
  "edge-tts>=6.1.12",
  "psutil>=5.9",
  "nvidia-ml-py>=12.535",
  "GPUtil>=1.4",
  "groq>=0.9",
  "openai>=1.30",
  "ollama>=0.1.8",
  "python-dotenv>=1.0"
]

[tool.vercel]
entrypoint = "workspace.app:app"
